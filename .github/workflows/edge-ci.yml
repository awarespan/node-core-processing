name: AWARESPAN Edge CI
on:
  push:
    branches: [main]
    paths: ['**/*.py', 'requirements/**', 'tests/**', '.github/workflows/edge-ci.yml']
  pull_request:
    branches: [main]
    paths: ['**/*.py', 'requirements/**', 'tests/**', '.github/workflows/edge-ci.yml']
jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install pinned CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu -r requirements/torch-cpu.txt
          python -m pip install --only-binary=:all: -r requirements/dev.txt
          python -m pip install --only-binary=:all: --no-deps -r requirements/ultralytics.txt
      - name: Compile Python modules
        run: python -m compileall -q node_runtime ml_pipeline shared scripts
      - name: Run edge unit tests
        run: python -m pytest -q
      - name: Validate Pi model artifacts
        run: python scripts/validate_ml_deployment.py --profile pi5_edge

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/runtime.txt
      - name: Install pinned CPU inference runtime
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu -r requirements/torch-cpu.txt
          python -m pip install --only-binary=:all: -r requirements/runtime.txt
          python -m pip install --only-binary=:all: --no-deps -r requirements/ultralytics.txt
      - name: Load and run active Pi models
        run: python scripts/smoke_test_models.py
