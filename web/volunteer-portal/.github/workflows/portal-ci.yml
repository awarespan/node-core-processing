name: AWARESPAN Volunteer Portal CI
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'vite.config.*', 'tsconfig*.json', '.github/workflows/portal-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', 'vite.config.*', 'tsconfig*.json', '.github/workflows/portal-ci.yml']
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
